name: k2-agents

services:
  k2-agents-postgres:
    image: postgres:16-alpine
    container_name: k2-agents-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k2agents}
      POSTGRES_USER: ${POSTGRES_USER:-k2agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - k2-agents-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-k2agents} -d ${POSTGRES_DB:-k2agents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  k2-agents-api:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: k2-agents-api
    depends_on:
      k2-agents-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=k2-agents-postgres;Port=5432;Database=${POSTGRES_DB:-k2agents};Username=${POSTGRES_USER:-k2agents};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      Secrets__EncryptionKey: ${SECRETS_ENCRYPTION_KEY:?Defina SECRETS_ENCRYPTION_KEY no arquivo .env}
      AI__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AI__OpenAI__DefaultModel: ${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      Cors__Origins__0: http://localhost:${WEB_PORT:-4310}
      Database__MigrateOnStartup: "true"
      Database__Seed: ${SEED_DEMO_DATA:-true}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Storage__RootPath: /app/storage
    volumes:
      - k2-agents-storage:/app/storage
    ports:
      - "${API_PORT:-5100}:8080"

  k2-agents-web:
    build:
      context: ./FrontEnd/k2-agents-web
      dockerfile: Dockerfile
    container_name: k2-agents-web
    depends_on:
      - k2-agents-api
    ports:
      - "${WEB_PORT:-4310}:80"

volumes:
  k2-agents-pgdata:
  k2-agents-storage:
