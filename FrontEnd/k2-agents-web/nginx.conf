server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;
  server_tokens off;

  # API encaminhada ao container da API: mesma origem, sem CORS no navegador.
  location /api/ {
    proxy_pass http://k2-agents-api:8080;
    # HTTP/1.1: o Kestrel rejeita POST HTTP/1.0 sem Content-Length.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # SignalR (WebSockets) para conversas em tempo real.
  location /hubs/ {
    proxy_pass http://k2-agents-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Widget incorporável: nomes fixos (sem hash), então sem cache longo; carregável por qualquer site.
  # Sem CSP/X-Frame-Options da aplicação: o script roda dentro do site do cliente.
  location ^~ /widget/ {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location ~* \.(js|css|woff2?|svg|png|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location /i18n/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Rotas do Angular (SPA). index.html sem cache: um deploy novo aparece no próximo carregamento.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
