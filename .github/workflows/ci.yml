name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BackEnd/K2Agents.sln
      - name: Build
        run: dotnet build BackEnd/K2Agents.sln -c Release --no-restore -warnaserror
      # Inclui os testes com PostgreSQL real (Testcontainers usa o Docker do runner)
      # e os provedores de IA e WhatsApp simulados: nenhuma chamada paga ou externa.
      - name: Test
        run: dotnet test BackEnd/K2Agents.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Vulnerable packages
        run: |
          dotnet list BackEnd/K2Agents.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qiE "\b(High|Critical)\b" vulnerable.txt; then echo "::error::Pacotes NuGet com vulnerabilidade alta/crítica"; exit 1; fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd/k2-agents-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/k2-agents-web/package-lock.json
      - run: npm ci
      # Inclui o teste que compara as traduções pt-BR × en (chaves e parâmetros).
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx ng build --configuration production
      - name: Audit (produção, severidade alta ou maior)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t k2-agents-api ./BackEnd
          docker build -t k2-agents-web ./FrontEnd/k2-agents-web
      - name: Validate docker-compose
        run: |
          sh scripts/setup-env.sh
          docker compose config --quiet
